version: 2

updates:
  # Restores what upstream had. Three security updates it raised were still
  # open when that repository disappeared; they survive as salvage/dependabot-*.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per month for routine bumps. Security updates ignore grouping
      # and limits, so they still arrive individually and immediately.
      all-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
