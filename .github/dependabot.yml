version: 2

updates:
  # Restores what upstream had. Three security updates it raised were still
  # open when that repository disappeared; they survive as salvage/dependabot-*.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per month for routine bumps. Without applies-to:
      # security-updates, this grouping and open-pull-requests-limit cover
      # version updates only; alert-triggered security updates are raised
      # separately, under their own limit.
      all-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
