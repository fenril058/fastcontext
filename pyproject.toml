[project]
name = "fastcontext"
version = "0.1.0"
description = "The FastContext (explore) is a code search agent."
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
]


[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

benchmark = [
    "datasets>=5.0.1",
    "litellm!=1.82.7,!=1.82.8,>=1.94.0",
    "platformdirs>=4.11.0",
    "prompt-toolkit>=3.0.53",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "textual>=8.2.8",
    "tqdm>=4.70.0",
    "typer>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[project.scripts]
fastcontext = "fastcontext.cli:main"

[tool.pytest.ini_options]
# Without testpaths, pytest also collects third_party/mini-swe-agent and aborts
# during collection because that submodule's own dependencies are not installed.
testpaths = ["tests"]
# The test suite writes plain `async def test_*` without @pytest.mark.asyncio.
asyncio_mode = "auto"
markers = [
    "requires_llm: needs a live OpenAI-compatible endpoint (FC_BASE_URL / FC_MODEL)",
]

[tool.ruff]
# Without an explicit rule set, the lint gate is whatever the installed ruff
# happens to default to, and that changes between releases: upgrading 0.14 to
# 0.16 turned 41 previously-silent findings into CI failures. Pin the selection
# so a ruff bump cannot redefine what this project enforces.
line-length = 119
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.isort]
profile = "black"
line_length = 119
ignore_whitespace = true
py_version = 310

[tool.black]
line_length = 119
